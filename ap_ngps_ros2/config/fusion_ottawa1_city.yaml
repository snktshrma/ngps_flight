# Live VO + NGPS fusion, City of Ottawa 2022 z20 map 1.45 km (Zone 2 + green box), Ottawa site 45.317542,-75.756285 (2026-10-24). See vo_ngps_fusion_node.py.
vo_ngps_fusion_node:
  ros__parameters:
    reference_image_path: /home/rmackay9/ngps_ws/src/ngps_flight/ngps_config/tiff/ottawa1_city/mosaic.tif
    metadata_path: /home/rmackay9/ngps_ws/src/ngps_flight/ngps_config/tiff/ottawa1_city/metadata.json
    mosaic_meters_per_pixel: 0.10498
    tensorrt_engine_path: /home/rmackay9/ngps_ws/src/ngps_flight/ap_ngps_ros2/weights/superpoint_lightglue_k1024_640x360_fp16.engine
    match_threshold: 0.1
    # VO on the GPU (NVIDIA VPI ORB + matcher): ~11 ms per frame against ~40 ms for CPU ORB,
    # same accuracy on the flight 3/4 replays (bags/flight4_analysis/vo_backend_compare.json).
    # Falls back to CPU ORB, with a GCS warning, if VPI is unavailable.
    vo_backend: vpi_cuda
    vpi_features_per_level: 500
    # 25 Hz VO (every frame of the ~25 fps ZR10): average age at the FC ~246 ms against ~282 ms at
    # 10 Hz on the live-camera bench, inside VISO_DELAY_MS 250 (bags/flight4_analysis/replay/).
    vo_rate_hz: 25.0
    # Forward prediction: the camera makes /ap/tf ~420-480 ms late (flights 4-6), VISO_DELAY_MS covers
    # 250, so push positions 200 ms ahead (SITL + flight-log tests: bags/flight6_analysis/).
    predict_ms: 200.0
    # NGPS fixes reach /ap/tf at <= 0.4 m/s (a 2.2 m fix as a step gave EKF3 a 0.93 m/s velocity
    # error in the flight 7 replay).
    ngps_blend_mps: 0.4
    # Camera intrinsics (HFOV, yaw and nadir offsets) come from ap_ngps_ros2/camera.py;
    # config_check rejects a value here that disagrees with it.
    # Terrain correction (terrain.py): off until ngps_config/terrain/ottawa0/dem.npz (NRCan HRDEM) is built;
    # the site is flat farmland, so it matters little here. To enable, uncomment:
    # terrain_dem_path: /home/rmackay9/ngps_ws/src/ngps_flight/ngps_config/terrain/ottawa0/dem.npz
